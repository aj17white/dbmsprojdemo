 return custShell(`<section class="hero"><div class="wrap hero-in"><div><h1>Find the Right Car for Your Next Journey.</h1><p>Compare available cars, choose your dates, and reserve in a few minutes. Our staff confirms your booking, and the assistant can help you find a car by budget or seats.</p><a class="btn btn-primary btn-lg" href="#cars">Browse Available Cars</a></div><div class="hero-art"><img src="${uri('SUV','#B6BCC6',true)}" alt="Illustration of a silver SUV"></div></div><div class="wrap"><form class="panel search-card" data-form="homesearch" novalidate>${field({name:'pickup',label:'Pickup date',type:'date',value:S.search.pickup,attrs:`min="${TODAY}"`})}${field({name:'ret',label:'Return date',type:'date',value:S.search.ret,attrs:`min="${TODAY}"`})}${sel({name:'cat',label:'Vehicle category',value:S.f.cars.cat,opts:['All'].concat(CATS)})}<button class="btn btn-primary" style="height:40px">Search cars</button></form></div></section>

 const ord={Available:0,Rented:1,Maintenance:2};l.sort((a,b)=>f.sort==='asc'?a.rate-b.rate:f.sort==='desc'?b.rate-a.rate:f.sort==='year'?b.year-a.year:(ord[a.status]-ord[b.status])||a.rate-b.rate);return l}

 <aside class="panel res-panel" data-calc="detail"><h2 style="font-size:18px">Reserve this car</h2><div class="note ${msg[0]}">${msg[1]}</div>${bookable(c)?`${field({name:'dPick',label:'Pickup date',type:'date',value:p,attrs:`min="${TODAY}"`}).split('f-dPick').join('dPick')}${field({name:'dRet',label:'Return date',type:'date',value:r,attrs:`min="${TODAY}"`}).split('f-dRet').join('dRet')}<p class="err" id="dErr">${k.err}</p>${bookedNote(c)}<div class="line"><span class="muted">Rental duration</span><b id="dDays">${k.days&&!k.err?k.days+' day'+(k.days>1?'s':''):'—'}</b></div><div class="line"><span class="muted">Daily rate</span><b>${peso(c.rate)}</b></div><div class="line total"><span>Estimated cost</span><span id="dTotal">${k.days&&!k.err?peso(k.total):'—'}</span></div><button class="btn btn-primary btn-lg btn-block" data-act="detail-reserve">Reserve Now</button>`:`<button class="btn btn-primary btn-lg btn-block" disabled>Reserve Now</button>`}</aside></div></div>`,'cars')}

const strip=p=>p.replace(/[\s-]/g,'');
const pwErr=p=>p.length<8?'Use at least 8 characters.':(!/[A-Za-z]/.test(p)||!/\d/.test(p))?'Include at least one letter and one number.':'';

function calcAny(rate,p,r,keep){if(!keep||!p||!r)return calc(rate,p,r);const d=dayDiff(p,r);if(d<1)return{days:0,total:0,err:'Return date must be after the pickup date.',field:'ret'};if(d>30)return{days:d,total:0,err:'Rentals are limited to 30 days.',field:'ret'};return{days:d,total:d*rate,err:'',field:''}}

  $('#dErr').textContent=e;$('#dDays').textContent=k.days&&!k.err?k.days+' day'+(k.days>1?'s':''):'—';$('#dTotal').textContent=k.days&&!k.err?peso(k.total):'—'},
 reserve(){const c=getCar(ROUTE.id),p=$('#f-pickup').value,r=$('#f-ret').value,k=calc(c.rate,p,r);S.search={pickup:p,ret:r};$('#sPeriod').textContent=k.err?'—':fmt(p)+' to '+fmt(r);$('#sDays').textContent=k.err?'—':k.days;$('#sTotal').textContent=k.err?'—':peso(k.total)},
 resdlg(){const c=getCar(+$('#f-car').value),k=c?calcAny(c.rate,$('#f-pickup').value,$('#f-ret').value,true):{err:'x'};$('#rfTot').textContent=k.err?'Total: —':'Total: '+peso(k.total)+' for '+k.days+' day'+(k.days>1?'s':'')}};

 if(['reserve','confirmation','reservations','profile','assistant'].indexOf(name)>-1){if(!u){S.next=raw;toast('Log in to continue.','info');return go('login')}if(u.role!=='Customer'){toast('This page is for customer accounts.','info');return go('admin')}}
 const isAdm=name==='admin'||name.indexOf('admin-')===0;

 if((name==='login'||name==='register')&&u&&u.role==='Customer')return go('home');
 if(name!=='admin-user')S.editUser=false;
 const Vw={home:viewHome,login:viewLogin,register:viewRegister,cars:viewCars,car:()=>viewCar(id),reserve:()=>viewReserve(id),confirmation:()=>viewConfirm(id),reservations:viewReservations,profile:viewProfile,assistant:viewAssistant,'admin-login':viewAdminLogin,admin:viewDash,'admin-vehicles':viewAdminCars,'admin-vehicle-new':()=>viewCarForm(),'admin-vehicle-edit':()=>viewCarForm(id),'admin-reservations':viewAdminRes,'admin-reservation':()=>viewAdminResDetail(id),'admin-payments':viewAdminPay,'admin-users':viewAdminUsers,'admin-user':()=>viewAdminUser(id),'admin-reports':viewReports};
 $('#app').innerHTML=(Vw[name]||viewHome)();window.scrollTo(0,0);
 if(name==='cars')setTimeout(renderCarGrid,450);if(name==='reservations')renderMyRes();if(name==='assistant')renderChat();if(name==='admin-vehicles')renderAdminCars();if(name==='admin-reservations')renderAdminRes();if(name==='admin-payments')renderAdminPay();if(name==='admin-users')renderAdminUsers()}
window.addEventListener('hashchange',render);render();
})();
